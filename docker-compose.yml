version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: narrator_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: always
    command: python bot.py
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: always
    command: python worker.py
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
